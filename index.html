<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="線上查詢倉頡、注音、大易、行列、無蝦米輸入法編碼，支援 CJK 與多種字元">
  <meta name="theme-color" content="#2563eb">
  <meta name="color-scheme" content="light dark">
  <title>輸入法查碼</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1 id="pageTitle">輸入法查碼</h1>
  <p class="subtitle" id="pageSubtitle">請點選下方任一種輸入法開始查碼</p>
  <p class="note" id="pageNote" hidden></p>

  <div class="method-switcher" id="methodSwitcher" role="tablist" aria-label="選擇輸入法">
    <button type="button" data-method="cangjie" class="method-btn" role="tab" aria-selected="false">倉頡</button>
    <button type="button" data-method="zhuyin" class="method-btn" role="tab" aria-selected="false">注音</button>
    <button type="button" data-method="dayi" class="method-btn" role="tab" aria-selected="false">大易</button>
    <button type="button" data-method="array" class="method-btn" role="tab" aria-selected="false">行列</button>
    <button type="button" data-method="boshiamy" class="method-btn" role="tab" aria-selected="false">無蝦米</button>
  </div>

  <div class="card">
    <div class="input-group">
      <label for="charInput" class="sr-only">請輸入要查詢的字元</label>
      <input type="text" id="charInput" placeholder="請先選擇輸入法" autocomplete="off" enterkeyhint="search" aria-describedby="status" disabled>
      <button id="searchBtn" disabled aria-label="查詢">查詢</button>
    </div>

    <div id="status" class="status" role="status" aria-live="polite">請點選上方任一種輸入法以載入碼表</div>

    <div id="result" class="result" hidden>
      <div class="char-display" id="charDisplay"></div>
      <div class="code-list" id="codeList"></div>
    </div>
  </div>

  <footer id="footerSource"></footer>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="app.js" defer></script>

  <script data-goatcounter="https://terryjiun.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>

</body>
</html>
